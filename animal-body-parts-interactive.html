<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Body Parts – Match &amp; Learn</title>
<style>
:root{--ink:#1d2a5b;--blue:#4c8dff;--ok:#22b36b;--bad:#ee5a5a;--gold:#ffc83d;--pink:#ff8fb1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#d9ecff,#fff1d6 55%,#ffe0ec);min-height:100vh;padding:12px 12px 60px}
.wrap{max-width:980px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{margin:4px 0;font-size:clamp(24px,5vw,40px);background:linear-gradient(90deg,#4c8dff,#a46bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hud{display:flex;gap:8px;align-items:center;font-weight:700}
.pill{background:#fff;border-radius:20px;padding:6px 14px;box-shadow:0 2px 6px #0002}
#mute{border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;box-shadow:0 2px 6px #0002}
.bar{height:14px;background:#fff;border-radius:10px;overflow:hidden;margin:8px 0;box-shadow:inset 0 1px 4px #0003}
#fill{height:100%;width:0;background:linear-gradient(90deg,#22b36b,#ffc83d);transition:width .5s}
.sub{font-size:17px;margin:2px 0 8px}
#bank{position:sticky;top:0;z-index:20;background:#fff8e1;border:3px dashed var(--gold);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px;box-shadow:0 4px 10px #0002}
.chip{background:#fff;border:3px solid var(--blue);border-radius:22px;padding:8px 16px;font-size:clamp(16px,3.6vw,20px);font-weight:800;cursor:grab;user-select:none;touch-action:manipulation;transition:transform .15s}
.chip:hover{transform:scale(1.08)}
.chip.sel{background:var(--gold);border-color:#e0a400;transform:scale(1.12) rotate(-3deg)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media(max-width:760px){#grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border-radius:18px;border:4px solid #cfe0ff;padding:6px;text-align:center;box-shadow:0 4px 10px #0002;transition:transform .2s}
.card img{width:100%;border-radius:12px;display:block}
.slot{margin:8px 4px 4px;min-height:40px;border-bottom:3px solid var(--ink);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#9aa6d0;border-radius:8px 8px 0 0}
.slot.over{background:#fff3c4}
.card.done{border-color:var(--ok);background:#effff6}
.card.done .slot{border-color:var(--ok);color:var(--ok);background:#dff7ea}
.card.shake{animation:sh .45s;border-color:var(--bad)}
.card.pop{animation:pop .5s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes pop{40%{transform:scale(1.1) rotate(2deg)}}
#msg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);font-size:clamp(28px,8vw,56px);font-weight:900;color:#fff;text-shadow:0 3px 0 #0004;padding:10px 28px;border-radius:30px;z-index:50;pointer-events:none;white-space:nowrap}
#msg.show{animation:msg 1s forwards}
@keyframes msg{0%{transform:translate(-50%,-50%) scale(0)}25%{transform:translate(-50%,-50%) scale(1.15)}75%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
.cf{position:fixed;top:-30px;font-size:26px;z-index:40;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.ov{position:fixed;inset:0;background:#1d2a5bcc;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:#fff;border-radius:26px;padding:24px;max-width:480px;width:100%;text-align:center;box-shadow:0 10px 40px #0006;max-height:92vh;overflow:auto}
.panel h2{margin:4px 0;font-size:32px;color:var(--blue)}
.panel input{font:700 20px inherit;padding:10px 14px;border:3px solid var(--blue);border-radius:14px;width:80%;text-align:center;margin:10px 0}
.btn{font:800 20px "Trebuchet MS",Arial;border:0;border-radius:18px;padding:13px 28px;margin:6px;color:#fff;background:linear-gradient(#5aa0ff,#3b6fe0);cursor:pointer;box-shadow:0 5px 0 #2a4fa8}
.btn.g{background:linear-gradient(#35d089,#1c9e62);box-shadow:0 5px 0 #137046}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a4fa8}
.stars{font-size:44px;letter-spacing:6px}
.miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.miss span{background:#ffe3e3;border:2px solid var(--bad);border-radius:14px;padding:4px 12px;font-weight:800}
footer{text-align:center;margin-top:22px;font-size:14px;opacity:.8}
.hide{display:none}
</style>
</head>

/* ---------- sound ---------- */

function tapSlot(k){if(sel)drop(k,sel)}
function drop(k,w){
 var x=items[k];if(!w||x.done)return;sel=null;
 var c=document.getElementById("c"+k);
 if(w===x.w){x.done=true;streak++;if(x.wrong===0)score++;sCorrect();say(w);
  msg(PRAISE[Math.floor(Math.random()*PRAISE.length)],"#22b36b");confetti(streak>=3?26:10);
  render();var cc=document.getElementById("c"+k);cc.classList.add("pop");upd();
  if(items.every(function(y){return y.done}))setTimeout(finish,1200);
 }else{x.wrong++;streak=0;sWrong();msg(OOPS[Math.floor(Math.random()*OOPS.length)],"#ee5a5a");
  c.classList.add("shake");render();setTimeout(function(){var e=document.getElementById("c"+k);if(e)e.classList.remove("shake")},500);upd()}}
function upd(){var d=items.filter(function(x){return x.done}).length;
 document.getElementById("fill").style.width=(d/items.length*100)+"%";
 document.getElementById("sc").textContent="⭐ "+score;document.getElementById("st").textContent="🔥 "+streak}
function finish(){
 sWin();confetti(60);
 var n=items.length,missed=items.filter(function(x){return x.wrong>0}),nm=player?", "+player:"";
 var ov=document.getElementById("ov"),h;
 if(practice){
  h='<div class="panel"><div class="stars">🌟🌟🌟</div><h2>Practice complete'+nm+'!</h2><p style="font-size:18px">Great effort! Practice makes perfect. Now try the full game again.</p><button class="btn g" onclick="startGame()">🔄 Play again</button></div>';
 }else{
  var st=score===n?3:score>=Math.ceil(n*.75)?3:score>=Math.ceil(n*.5)?2:1;
  var t=score===n?"Perfect! You are an Animal Expert! 🏆":score>=9?"Great work! Almost perfect!":score>=6?"Good job! Keep practising!":"Nice try! Let's practise the tricky words.";
  h='<div class="panel"><div class="stars">'+"⭐".repeat(st)+"☆".repeat(3-st)+'</div><h2>Well done'+nm+'!</h2><div style="font-size:42px;font-weight:900">'+score+' / '+n+'</div><p style="font-size:18px">'+t+'</p>';
  if(missed.length){h+='<p style="margin:4px"><b>Words to practise:</b></p><div class="miss">'+missed.map(function(x){return"<span>"+x.w+"</span>"}).join("")+'</div><button class="btn g" onclick="practiseMissed()">💪 Practise these words</button>'}
  h+='<button class="btn" onclick="startGame()">🔄 Play again</button></div>';
  window.lastMissed=missed.map(function(x){return x.i});
 }
 ov.innerHTML=h;ov.className="ov"}
function practiseMissed(){sClick();begin(window.lastMissed,true)}
showStart();
</script>
</body>
</html>
